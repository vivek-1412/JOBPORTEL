<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobPort | Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">
    <nav class="navbar navbar-dark py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="/">
                Job<span class="brand-accent">Port</span>
            </a>
        </div>
    </nav>

    <div class="auth-wrapper d-flex align-items-center justify-content-center">
        <div class="auth-card">
            <div class="auth-header text-center mb-4">
                <div class="auth-icon mb-3">
                    <i class="bi bi-key-fill"></i>
                </div>
                <h2 class="fw-bold">Reset your password</h2>
                <p class="text-muted">Enter your email to create a reset link, or use the link from your email to set a new password.</p>
            </div>

            <div id="auth-alert" class="alert d-none mb-3" role="alert"></div>

            <div id="email-step">
                <form id="forgot-password-form" novalidate>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email Address</label>
                        <div class="input-group auth-input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" id="reset-email" class="form-control" placeholder="you@example.com" required autocomplete="email">
                        </div>
                    </div>
                    <button type="submit" id="forgot-btn" class="btn btn-primary w-100 py-2 fw-bold auth-submit-btn">
                        Send reset link
                    </button>
                </form>
            </div>

            <div id="password-step" class="d-none">
                <form id="reset-password-form" novalidate>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">New password</label>
                        <div class="input-group auth-input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" id="reset-password" class="form-control" placeholder="Enter a new password" required autocomplete="new-password">
                            <button type="button" class="input-group-text toggle-pass" onclick="togglePassword('reset-password', this)"><i class="bi bi-eye"></i></button>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Confirm new password</label>
                        <div class="input-group auth-input-group">
                            <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                            <input type="password" id="confirm-reset-password" class="form-control" placeholder="Re-enter your password" required autocomplete="new-password">
                            <button type="button" class="input-group-text toggle-pass" onclick="togglePassword('confirm-reset-password', this)"><i class="bi bi-eye"></i></button>
                        </div>
                    </div>
                    <button type="submit" id="reset-btn" class="btn btn-primary w-100 py-2 fw-bold auth-submit-btn">
                        Reset password
                    </button>
                </form>
            </div>

            <p class="text-center text-muted mt-4 mb-0 small">
                Remember your password?
                <a href="/login" class="text-primary fw-semibold">Back to login</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script>
        checkAuthRedirect();

        const urlParams = new URLSearchParams(window.location.search);
        const resetToken = urlParams.get('token');
        const emailStep = document.getElementById('email-step');
        const passwordStep = document.getElementById('password-step');

        if (resetToken) {
            emailStep.classList.add('d-none');
            passwordStep.classList.remove('d-none');
        }

        document.getElementById('forgot-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAuthAlert();

            const email = document.getElementById('reset-email').value.trim().toLowerCase();
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showAuthAlert('Please enter a valid email address.');
                return;
            }

            setButtonLoading('forgot-btn', true, 'Send reset link');

            try {
                const res = await fetch(`${window.API_BASE_URL}/api/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email }),
                });

                const data = await res.json();

                if (!res.ok) {
                    showAuthAlert(data.error || 'Unable to process password reset.');
                    return;
                }

                showAuthAlert(
                    '<i class="bi bi-check-circle-fill me-2"></i>If an account exists, a reset link has been sent to your email. Open it to continue.',
                    'success'
                );
                document.getElementById('reset-email').value = '';
            } catch (err) {
                console.error('Forgot password error:', err);
                showAuthAlert('Cannot connect to server. Make sure Flask is running.');
            } finally {
                setButtonLoading('forgot-btn', false, 'Send reset link');
            }
        });

        document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAuthAlert();

            const newPassword = document.getElementById('reset-password').value;
            const confirmPassword = document.getElementById('confirm-reset-password').value;

            if (!newPassword || newPassword.length < 8) {
                showAuthAlert('Password must be at least 8 characters.');
                return;
            }

            if (newPassword !== confirmPassword) {
                showAuthAlert('Passwords do not match.');
                return;
            }

            setButtonLoading('reset-btn', true, 'Reset password');

            try {
                const res = await fetch(`${window.API_BASE_URL}/api/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: resetToken, new_password: newPassword }),
                });

                const data = await res.json();

                if (!res.ok) {
                    showAuthAlert(data.error || 'Unable to reset password.');
                    return;
                }

                showAuthAlert(
                    '<i class="bi bi-check-circle-fill me-2"></i>Password updated successfully. Redirecting to login…',
                    'success'
                );
                setTimeout(() => {
                    window.location.href = '/login';
                }, 1500);
            } catch (err) {
                console.error('Reset password error:', err);
                showAuthAlert('Cannot connect to server. Make sure Flask is running.');
            } finally {
                setButtonLoading('reset-btn', false, 'Reset password');
            }
        });
    </script>
</body>
</html>

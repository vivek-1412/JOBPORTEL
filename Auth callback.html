<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobPort | Signing you in…</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 55%, #1a56db 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .callback-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 48px 40px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.30);
            animation: slideUp .35s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0);    }
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 28px;
            display: block;
        }

        .brand span { color: #1a56db; }

        .spinner-wrap {
            margin-bottom: 20px;
        }

        .status-icon {
            font-size: 3.2rem;
            margin-bottom: 16px;
            display: none;
            line-height: 1;
        }

        .status-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .status-msg {
            font-size: 0.88rem;
            color: #64748b;
            margin: 0;
        }

        .progress-wrap {
            margin-top: 24px;
            height: 4px;
            background: #e2e8f0;
            border-radius: 99px;
            overflow: hidden;
            display: none;
        }

        .progress-bar-inner {
            height: 100%;
            background: #1a56db;
            border-radius: 99px;
            width: 0%;
            transition: width 1.2s ease;
        }
    </style>
</head>
<body>

    <div class="callback-card">

        <!-- Brand -->
        <a class="brand" href="/">Job<span>Port</span></a>

        <!-- Spinner (shown while loading) -->
        <div class="spinner-wrap" id="spinner-wrap">
            <div class="spinner-border text-primary"
                 style="width:3.2rem;height:3.2rem;border-width:4px;"
                 role="status">
                <span class="visually-hidden">Loading…</span>
            </div>
        </div>

        <!-- Status icon (shown after done) -->
        <div class="status-icon" id="status-icon"></div>

        <!-- Status text -->
        <div class="status-title" id="status-title">Completing sign in…</div>
        <p class="status-msg"    id="status-msg">
            Please wait while we verify your Google account.
        </p>

        <!-- Progress bar (shown on success) -->
        <div class="progress-wrap" id="progress-wrap">
            <div class="progress-bar-inner" id="progress-bar"></div>
        </div>

    </div>

    <!-- ✅ REPLACE THESE TWO VALUES WITH YOUR REAL KEYS -->
    <script>
        // ── YOUR SUPABASE KEYS ──────────────────────────────────────
        // Get from: Supabase Dashboard → Project Settings → API
        const SUPABASE_URL  = "https://fxxjqsawkyowuaxhymoh.supabase.co";
        const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ4eGpxc2F3a3lvd3VheGh5bW9oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMjIwNzEsImV4cCI6MjA5Mzc5ODA3MX0.6t0oUx2Q2KSdeFVAPld_ARzm5-ktxC-YcXzqcQi0zgk";
        //                     ↑ Replace this with your real anon key
        // ────────────────────────────────────────────────────────────
    </script>

    <!-- Supabase SDK (reads token from URL hash automatically) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // ── UI helpers ──
        const spinnerWrap = document.getElementById("spinner-wrap");
        const statusIcon  = document.getElementById("status-icon");
        const statusTitle = document.getElementById("status-title");
        const statusMsg   = document.getElementById("status-msg");
        const progressWrap = document.getElementById("progress-wrap");
        const progressBar  = document.getElementById("progress-bar");

        function showSuccess(name) {
            spinnerWrap.style.display  = "none";
            statusIcon.style.display   = "block";
            statusIcon.textContent     = "✅";
            statusTitle.textContent    = `Welcome, ${name}!`;
            statusMsg.textContent      = "Redirecting to JobPort…";
            progressWrap.style.display = "block";
            // Animate progress bar
            setTimeout(() => { progressBar.style.width = "100%"; }, 50);
        }

        function showError(message) {
            spinnerWrap.style.display = "none";
            statusIcon.style.display  = "block";
            statusIcon.textContent    = "❌";
            statusTitle.textContent   = "Sign in failed";
            statusMsg.textContent     = message || "Something went wrong. Redirecting to login…";
        }

        // ── Main callback handler ──
        async function handleCallback() {
            try {
                // Validate keys are set
                if (!SUPABASE_ANON || SUPABASE_ANON === "YOUR_ANON_PUBLIC_KEY_HERE") {
                    throw new Error(
                        "SUPABASE_ANON key not set in auth_callback.html. " +
                        "Open the file and replace YOUR_ANON_PUBLIC_KEY_HERE."
                    );
                }

                const { createClient } = supabase;
                const db = createClient(SUPABASE_URL, SUPABASE_ANON);

                // Supabase reads #access_token from the URL hash automatically
                const { data, error } = await db.auth.getSession();

                if (error) throw new Error(error.message);
                if (!data?.session) {
                    throw new Error(
                        "No session found. The OAuth flow may have failed or expired."
                    );
                }

                const session = data.session;
                const user    = session.user;

                // Build user object
                const fullName  = user.user_metadata?.full_name || "";
                const firstName = fullName.split(" ")[0] || user.email?.split("@")[0] || "User";
                const lastName  = fullName.split(" ").slice(1).join(" ") || "";

                const userObj = {
                    id:         user.id,
                    first_name: firstName,
                    last_name:  lastName,
                    email:      user.email,
                    avatar:     user.user_metadata?.avatar_url || null,
                    provider:   "google",
                };

                // Save session — Supabase access token acts as our JWT
                sessionStorage.setItem("jp_token", session.access_token);
                sessionStorage.setItem("jp_user",  JSON.stringify(userObj));

                // Also save to localStorage if user had "remember me" preference
                const rememberGoogle = localStorage.getItem("jp_remember_google") === "true";
                if (rememberGoogle) {
                    localStorage.setItem("jp_token", session.access_token);
                    localStorage.setItem("jp_user",  JSON.stringify(userObj));
                }

                // Show success UI
                showSuccess(firstName);

                // Redirect after progress bar fills
                const redirect = sessionStorage.getItem("jp_redirect") || "/";
                sessionStorage.removeItem("jp_redirect");

                setTimeout(() => {
                    window.location.href = redirect;
                }, 1400);

            } catch (err) {
                console.error("OAuth callback error:", err);
                showError(err.message);

                // Redirect to login after 3 seconds on error
                setTimeout(() => {
                    window.location.href = "/login";
                }, 3000);
            }
        }

        // Run immediately on page load
        handleCallback();
    </script>

</body>
</html>
